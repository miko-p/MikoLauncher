name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & check (shared + frontend + Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Rust toolchain（lighty-launch 需 Rust ≥ 1.95）
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # 缓存 cargo 与 pnpm，加速 CI
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Cache pnpm
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # Tauri 2 (Linux) 系统依赖
      - name: Install Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev

      - name: Install JS deps
        run: pnpm install

      # bun：供 build-binary.sh 将 sidecar 打成单文件可执行（发布链中的一环）
      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build shared + frontend
        run: pnpm run build

      - name: Frontend typecheck (plugin-host)
        run: pnpm --filter @miko-launcher/plugin-host typecheck

      # 持续验证发布链：sidecar 能正常打成单文件可执行并落到 externalBin 目录
      - name: Build sidecar binary (smoke)
        working-directory: apps/plugin-host
        run: bash ./build-binary.sh x86_64-unknown-linux-gnu

      - name: Rust check
        working-directory: apps/desktop/src-tauri
        run: cargo check --all-targets

      - name: Rust clippy
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --all-targets -- -D warnings
