[package]
name = "mc-launcher"
version = "0.1.0"
description = "MC Launcher Rust 核心 — LightyLauncherLib 封装 + Tauri 后端 + Node sidecar 宿主"
edition = "2021"

[lib]
name = "mc_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 真实版本清单拉取（Mojang API）
reqwest = { version = "0.13", features = ["json", "blocking"] }

# MC 启动内核：LightyLauncherLib 全家桶（MIT）
# M3 起：真实版本清单拉取 + LaunchConfig 启动结构
lighty-launch = { version = "26.5.12", features = ["events"] }
lighty-version = "26.5.12"

[features]
# M1 骨架无需额外 feature。完整 loaders/auth/java 在 M2 按需开启（default 缺省）
default = []

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
