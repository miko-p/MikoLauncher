[package]
name = "miko-launcher"
version = "0.1.0"
description = "MikoLauncher Rust 核心 — LightyLauncherLib 封装 + Tauri 后端 + Node sidecar 宿主"
edition = "2021"

[lib]
name = "miko_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 真实版本清单拉取（Mojang API）
reqwest = { version = "0.13", features = ["json", "blocking"] }

# MC 启动内核：LightyLauncherLib 全家桶（MIT）
# M4：接入 lighty-launch 完整启动 pipeline（Loader→安装→JVM 启动→pid）
lighty-launch = { version = "26.5.12", features = ["events"] }
lighty-version = "26.5.12"
lighty-loaders = { version = "26.5.12", features = ["vanilla", "fabric", "quilt", "neoforge", "forge"] }
lighty-auth = { version = "26.5.12", features = ["events"] }
lighty-core = "26.5.12"
lighty-event = "26.5.12"
lighty-java = "26.5.12"
lighty-modsloader = "26.5.12"

# 真实启动是 async（lighty 用 tokio）；Tauri command 需显式 runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }

[features]
# M1 骨架无需额外 feature。完整 loaders/auth/java 在 M2 按需开启（default 缺省）
default = []

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
