[package]
name = "miko-launcher"
version = "0.1.0"
description = "MikoLauncher Rust 核心 — LightyLauncherLib 封装 + Tauri 后端 + Node sidecar 宿主"
edition = "2021"

[lib]
name = "miko_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 真实版本清单拉取（Mojang API）
reqwest = { version = "0.13", features = ["json", "blocking"] }

# MC 启动内核：LightyLauncherLib 全家桶（MIT）
# M4：接入 lighty-launch 完整启动 pipeline（Loader→安装→JVM 启动→pid）
lighty-launch = { version = "26.5.12", features = ["events"] }
lighty-version = "26.5.12"
lighty-loaders = { version = "26.5.12", features = ["vanilla", "fabric", "quilt", "neoforge", "forge"] }
lighty-auth = { version = "26.5.12", features = ["events"] }
lighty-core = "26.5.12"
lighty-event = "26.5.12"
lighty-java = "26.5.12"
lighty-modsloader = "26.5.12"

# 真实启动是 async（lighty 用 tokio）；Tauri command 需显式 runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }

# M7：微软 refresh_token 存 OS keyring（keystore），accounts.json 不再明文存凭据。
# 可选 feature `keyring` 启用；未启用或无 D-Bus 会话时回退到 accounts.json 内置存储。
keyring = { version = "3.6", features = ["sync-secret-service", "apple-native", "windows-native"], optional = true }

# 账号 last_used / 时间戳：统一用 chrono 生成正确 ISO8601（避免手写伪日期）。
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[features]
# M7-2：默认启用 OS keyring（微软凭据加密存 Keystore/Credential Manager/Secret Service）。
# 依赖 D-Bus（Linux）；即便无可用 keyring 会话，代码也会安全回退到 accounts.json 内置存储。
default = ["keyring"]
# M7-2：微软凭据存 OS keyring（Keystore/Credential Manager/Secret Service）
keyring = ["dep:keyring", "lighty-auth/keyring"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
